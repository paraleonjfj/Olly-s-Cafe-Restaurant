<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Olly's | Lucena City</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Navigation Bar -->
        <header>
            <nav>
                <a href="index.html">
                    <img src="Olly's logo.png" alt="Olly's Logo" class="logo">
                </a>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                </ul>
            </nav>
        </header>

        <!-- Home Page Hero Slideshow -->
        <main>

            <section class="hero">

                <!-- Slideshow Images -->
                <div class="hero-slides">

                    <div class="hero-slide active">
                        <img src="home banner.jpg">
                    </div>

                    <div class="hero-slide">
                        <img src="home banner (2).jpg">
                    </div>

                    <div class="hero-slide">
                        <img src="home banner (3).jpg">
                    </div>

                    <div class="hero-slide">
                        <img src="home banner (4).jpg">
                    </div>

                </div>

                <!-- Dark Overlay -->
                <div class="hero-overlay"></div>

                <!-- Hero Text -->
                <div class="hero-content">

                    <p class="subtitle">OLLY'S LUCENA CITY BRANCH</p>

                    <h1>GOOD FOOD. GREAT COFFEE.<br>BETTER MOMENTS.</h1>

                    <p class="description">
                        OPEN DAILY | 8AM - 11PM
                    </p>

                    <a href="products.html" class="shop-button">
                        VIEW OUR MENU <span>→</span>
                    </a>

                </div>

                <!-- Previous and Next Buttons -->
                <button class="slide-arrow prev" aria-label="Previous image">
                    &#10094;
                </button>

                <button class="slide-arrow next" aria-label="Next image">
                    &#10095;
                </button>

                <!-- Slide Indicators -->
                <div class="slide-dots">
                    <button class="dot active" aria-label="Go to slide 1"></button>
                    <button class="dot" aria-label="Go to slide 2"></button>
                    <button class="dot" aria-label="Go to slide 3"></button>
                    <button class="dot" aria-label="Go to slide 4"></button>
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Olly’s. All Rights Reserved.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
